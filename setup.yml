---
# Ansible playbook to set up development environment
# Supports: Linux (Debian/Ubuntu), macOS, Termux
# Usage: ansible-playbook -i localhost, -c local setup.yml

- name: Set up development environment
  hosts: localhost
  become: false
  gather_facts: true
  vars:
    home_dir: "{{ ansible_env.HOME }}"
    dotfiles_dir: "{{ lookup('env', 'PWD') | default(home_dir + '/dotfiles', true) }}"
    # Platform-specific package maps
    debian_packages:
      - build-essential
      - software-properties-common
      - psmisc
      - curl
      - git
      - wget
      - tmux
      - neovim
      - fish
      - ledger
      - mosh
      - python3-pip
      - mosquitto-clients
      - postgresql-client
      - jq
      - rsync
      - ansible
      - gnupg
      - ripgrep
      - fd-find
      - fzf
      - bat
      - tree
    darwin_packages:
      - git
      - curl
      - wget
      - tmux
      - jq
      - rsync
      - neovim
      - fish
      - mosh
      - ledger
      - mosquitto
      - postgresql
      - ansible
      - gnupg
      - ripgrep
      - fd
      - fzf
      - bat
      - tree
    termux_packages:
      - git
      - curl
      - wget
      - tmux
      - jq
      - rsync
      - neovim
      - fish
      - python
      - nodejs
      - openssh
      - postgresql
      - gnupg
      - ripgrep
      - fd
      - fzf
      - bat
      - tree
      - starship
      - mosh
    python_packages:
      - RNS
      - dacar
    pi_packages:
      - "npm:pi-glm-usage"
      - "npm:pi-rngit-work-document-skill"
    node_version: "24"
    starship_version: "v1.26.0"
    sops_version: "v3.13.3"

  pre_tasks:
    - name: Display system information
      debug:
        msg:
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Family: {{ ansible_facts['os_family'] }}"
          - "Arch: {{ ansible_facts['architecture'] }}"
          - "Package manager: {{ ansible_facts['pkg_mgr'] }}"
          - "Termux: {{ ansible_env.TERMUX_VERSION is defined }}"

    - name: Install packaging library (Ansible pip module dependency)
      ansible.builtin.command:
        cmd: "{{ ansible_python.executable }} -m pip install packaging --break-system-packages --user"
      register: packaging_install
      changed_when: "'Successfully installed' in packaging_install.stdout"
      failed_when: "packaging_install.rc != 0 and 'Requirement already satisfied' not in packaging_install.stdout"

  tasks:
    # ============================================================
    # System packages
    # ============================================================

    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install packages via apt (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ debian_packages }}"
        state: present
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure .local/bin directory exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Check if Debian tools exist (for symlinks)
      ansible.builtin.stat:
        path: "{{ item.src }}"
      loop:
        - { src: /usr/bin/fdfind, name: fd }
        - { src: /usr/bin/batcat, name: bat }
      register: tool_stat
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] != 'Termux'

    - name: Create tool symlinks on Debian/Ubuntu (packages have different names)
      ansible.builtin.file:
        src: "{{ item.item.src }}"
        dest: "{{ home_dir }}/.local/bin/{{ item.item.name }}"
        state: link
      loop: "{{ tool_stat.results }}"
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] != 'Termux'
        - item.stat.exists

    - name: Install packages via homebrew (macOS)
      community.general.homebrew:
        name: "{{ darwin_packages }}"
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install packages via pkg (Termux)
      ansible.builtin.command:
        cmd: "pkg install -y {{ termux_packages | join(' ') }}"
      register: termux_install
      changed_when: "'up-to-date' not in termux_install.stdout | default('')"
      when: "'termux' in ansible_facts['system_image'] | default('') or ansible_env.TERMUX_VERSION is defined"

    # ============================================================
    # Python packages
    # ============================================================

    - name: Install Python packages via pip (Debian/Ubuntu)
      ansible.builtin.pip:
        name: "{{ python_packages }}"
        state: present
        extra_args: "--break-system-packages"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install Python packages via pip (macOS)
      ansible.builtin.pip:
        name: "{{ python_packages }}"
        state: present
        extra_args: --break-system-packages --user
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install Python packages via pip (Termux)
      ansible.builtin.pip:
        name: "{{ python_packages }}"
        state: present
      when: "'termux' in ansible_facts['system_image'] | default('') or ansible_env.TERMUX_VERSION is defined"

    # ============================================================
    # Node.js
    # ============================================================

    - name: Check installed Node.js version
      ansible.builtin.command: node --version
      register: node_version_check
      changed_when: false
      failed_when: false

    - name: Parse Node.js version
      ansible.builtin.set_fact:
        installed_node_version: "{{ node_version_check.stdout | regex_replace('^v', '') }}"
      when: node_version_check.rc == 0

    - name: Check if Node.js version matches desired
      ansible.builtin.set_fact:
        node_version_matches: "{{ installed_node_version.startswith(node_version) if installed_node_version is defined else false }}"
      when: node_version_check.rc == 0

    - name: Install Node.js via nvm (Debian/Ubuntu)
      block:
        - name: Check if nvm is installed
          ansible.builtin.stat:
            path: "{{ home_dir }}/.nvm/nvm.sh"
          register: nvm_stat

        - name: Install nvm
          ansible.builtin.shell:
            cmd: |
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.0/install.sh | bash
          when: not nvm_stat.stat.exists

        - name: Install Node.js {{ node_version }} via nvm
          ansible.builtin.shell: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install {{ node_version }}
            nvm alias default {{ node_version }}
          when: not nvm_stat.stat.exists or not node_version_matches | default(false)
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install Node.js via homebrew (macOS)
      community.general.homebrew:
        name: node@{{ node_version }}
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    # Node.js is already installed via pkg in Termux

    # ============================================================
    # Starship prompt
    # ============================================================

    - name: Install starship via pkg (Termux)
      ansible.builtin.command:
        cmd: "pkg install -y starship"
      register: termux_starship
      changed_when: "'up-to-date' not in termux_starship.stdout | default('')"
      when: "'termux' in ansible_facts['system_image'] | default('') or ansible_env.TERMUX_VERSION is defined"

    - name: Determine Starship architecture
      ansible.builtin.set_fact:
        starship_arch: >-
          {{ 'x86_64-unknown-linux-musl'
             if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'x86_64'
             else 'aarch64-unknown-linux-musl'
             if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'aarch64'
             else 'x86_64-apple-darwin'
             if ansible_facts['os_family'] == 'Darwin' and ansible_facts['architecture'] == 'x86_64'
             else 'aarch64-apple-darwin'
             if ansible_facts['os_family'] == 'Darwin' and ansible_facts['architecture'] == 'arm64'
             else 'x86_64-unknown-linux-musl' }}
      when: "'termux' not in ansible_facts['system_image'] | default('') and ansible_env.TERMUX_VERSION is not defined"

    - name: Download Starship
      ansible.builtin.get_url:
        url: "https://github.com/starship/starship/releases/download/{{ starship_version }}/starship-{{ starship_arch }}.tar.gz"
        dest: "/tmp/starship-{{ starship_arch }}.tar.gz"
        mode: "0644"
      when:
        - "'termux' not in ansible_facts['system_image'] | default('')"
        - ansible_env.TERMUX_VERSION is not defined

    - name: Extract and install Starship
      ansible.builtin.command:
        cmd: "tar -xzf /tmp/starship-{{ starship_arch }}.tar.gz -C {{ home_dir }}/.local/bin starship"
        creates: "{{ home_dir }}/.local/bin/starship"
      when:
        - "'termux' not in ansible_facts['system_image'] | default('')"
        - ansible_env.TERMUX_VERSION is not defined

    - name: Set Starship executable permissions
      ansible.builtin.file:
        path: "{{ home_dir }}/.local/bin/starship"
        mode: "0755"
      when:
        - "'termux' not in ansible_facts['system_image'] | default('')"
        - ansible_env.TERMUX_VERSION is not defined

    # ============================================================
    # sops (not in default apt repos)
    # ============================================================

    - name: Determine sops architecture
      ansible.builtin.set_fact:
        sops_arch: >-
          {{ 'linux.amd64'
             if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'x86_64'
             else 'linux.arm64'
             if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'aarch64'
             else 'darwin.amd64'
             if ansible_facts['os_family'] == 'Darwin' and ansible_facts['architecture'] == 'x86_64'
             else 'darwin.arm64'
             if ansible_facts['os_family'] == 'Darwin' and ansible_facts['architecture'] == 'arm64'
             else 'linux.amd64' }}

    - name: Check if sops is installed
      ansible.builtin.stat:
        path: "{{ home_dir }}/.local/bin/sops"
      register: sops_stat

    - name: Download and install sops (Debian/Ubuntu - not in apt)
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.{{ sops_arch }}"
        dest: "{{ home_dir }}/.local/bin/sops"
        mode: "0755"
      when:
        - ansible_facts['os_family'] == 'Debian'
        - not sops_stat.stat.exists

    - name: Install sops via homebrew (macOS)
      community.general.homebrew:
        name: sops
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install sops via pkg (Termux)
      ansible.builtin.command:
        cmd: "pkg install -y sops"
      register: termux_sops
      changed_when: "'up-to-date' not in termux_sops.stdout | default('')"
      failed_when: false
      when: "'termux' in ansible_facts['system_image'] | default('') or ansible_env.TERMUX_VERSION is defined"

    # ============================================================
    # Pi coding agent
    # ============================================================

    - name: Check if pi is already installed
      ansible.builtin.command:
        cmd: which pi
      register: pi_check
      changed_when: false
      failed_when: false
      tags: skip-ci

    - name: Install Pi coding agent globally
      ansible.builtin.npm:
        name: "@earendil-works/pi-coding-agent"
        global: true
        ignore_scripts: true
      when: pi_check.rc != 0
      tags: skip-ci

    # ============================================================
    # Dotfiles setup
    # ============================================================

    - name: Check if dotfiles directory exists
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}"
      register: dotfiles_stat

    - name: Fail if dotfiles directory doesn't exist
      ansible.builtin.fail:
        msg: |
          Dotfiles directory not found at {{ dotfiles_dir }}.
          Either:
          1. Run this playbook from within the dotfiles directory
          2. Clone to {{ home_dir }}/dotfiles: git clone <repo-url> {{ home_dir }}/dotfiles
          3. Pass the correct path: ansible-playbook -e dotfiles_dir=/path/to/dotfiles setup.yml
      when: not dotfiles_stat.stat.exists

    - name: Initialize and update git submodules
      ansible.builtin.command:
        cmd: git -C "{{ dotfiles_dir }}" submodule update --init --recursive

    - name: Ensure .config directory exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.config"
        state: directory
        mode: "0755"

    - name: Create stow-like symlinks
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ home_dir }}/{{ item.dest }}"
        state: link
        force: true
      loop:
        # fish
        - { src: fish/.config/fish, dest: .config/fish }
        - { src: fish/.tmux.conf, dest: .tmux.conf }
        # git
        - { src: git/.gitconfig, dest: .gitconfig }
        # nvim
        - { src: nvim/.config/nvim, dest: .config/nvim }
        # pi
        - { src: pi/.pi, dest: .pi }

    - name: Install Pi packages (after dotfiles are in place)
      ansible.builtin.command:
        cmd: "pi install {{ item }}"
      loop: "{{ pi_packages }}"
      register: pi_install
      changed_when: "'already installed' not in pi_install.stdout | default('')"
      failed_when: pi_install.rc != 0 and 'already installed' not in pi_install.stdout | default('')
      when: pi_check.rc == 0
      tags: skip-ci

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - ""
          - "✓ Development environment setup complete!"
          - ""
          - "Next steps:"
          - "  1. Add Starship to your shell config:"
          - "     fish: starship init fish | source"
          - "     bash: eval \"$(starship init bash)\""
          - "  2. Restart your shell or source the config"
          - "  3. Enjoy your new development environment!"
