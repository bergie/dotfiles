name: Docker

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      -
        name: Set up QEMU for multiarch building
        uses: docker/setup-qemu-action@v3
      -
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          install: true
      -
        name: Build multiarch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            bergie/shell:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Smoke test (amd64)
        run: |
          docker buildx build --platform linux/amd64 --load \
            --cache-from type=gha \
            -t bergie/shell:test .
          docker run --rm bergie/shell:test node --version
          docker run --rm bergie/shell:test starship --version
          docker run --rm bergie/shell:test sops --version
          docker run --rm bergie/shell:test sh -c "id -un && ls /home/bergie/.pi/agent"

  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      -
        name: Set up QEMU for multiarch building
        uses: docker/setup-qemu-action@v3
      -
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          install: true
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_TOKEN }}
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bergie/shell:latest
            bergie/shell:${{ github.sha }}
            ghcr.io/${{ github.repository }}/shell:latest
            ghcr.io/${{ github.repository }}/shell:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
